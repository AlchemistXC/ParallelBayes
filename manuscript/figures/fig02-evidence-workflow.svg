   <g id="text_2">
    <text style="font-size: 9px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #23333b" x="35.70378" y="16.167189" transform="rotate(-0 35.70378 16.167189)">误差连接：每支箭头都需要条件</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #23333b" x="61.878898" y="51.040912" transform="rotate(-0 61.878898 51.040912)">轨迹残差 r</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #23333b" x="177.485669" y="51.060287" transform="rotate(-0 177.485669 51.060287)">单步核误差 δ</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(265.092441 45.23726)">近似链与基准链</text>
    <text style="font-size: 8px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(277.092441 56.872065)">的分布差</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #23333b" x="408.699213" y="51.052787" transform="rotate(-0 408.699213 51.052787)">函数期望差</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.4px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(22.61622 78.672809)">残差 → 核误差</text>
    <text style="font-size: 7.4px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(22.61622 89.748528)">需稳定性或分支控制</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.4px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(153.491811 78.653153)">核误差 → 分布差</text>
    <text style="font-size: 7.4px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(153.491811 89.256544)">示例需式（11）的收缩</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.4px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(314.905039 78.649684)">TV → 期望差</text>
    <text style="font-size: 7.4px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(314.905039 89.758934)">直接界限用于有界函数</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.6px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #23333b" x="22.61622" y="115.236664" transform="rotate(-0 22.61622 115.236664)">还需基准链混合、初始化与估计方差，才能评价后验 MSE。</text>
   </g>
  </g>
