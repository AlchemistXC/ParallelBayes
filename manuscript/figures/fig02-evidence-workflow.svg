   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #23333b" x="35.70378" y="155.117397" transform="rotate(-0 35.70378 155.117397)">比较协议：先固定问题，再计量完整成本</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(48.060157 184.315749)">预设目标</text>
    <text style="font-size: 8px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(32.060157 195.890554)">函数、误差、资源</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(153.485669 184.376374)">确认比较对象</text>
    <text style="font-size: 8px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(145.485669 195.926179)">同一路径或不同核</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(266.911181 184.323874)">完整流程计时</text>
    <text style="font-size: 8px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(258.911181 195.878679)">编译、预热、采样</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(384.336693 184.331999)">误差与诊断</text>
    <text style="font-size: 8px; font-family: 'Arial Unicode MS'; fill: #23333b" transform="translate(372.336693 195.939304)">不确定性、失败率</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.8px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #23333b" x="22.61622" y="230.149815" transform="rotate(-0 22.61622 230.149815)">路径等价已确认：可比较固定步数的执行时间。</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.8px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #23333b" x="22.61622" y="250.473822" transform="rotate(-0 22.61622 250.473822)">核或近似程度不同：比较共同误差目标，并披露参照不确定性。</text>
   </g>
